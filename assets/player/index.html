<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>Lecture Video</title>
<link rel="stylesheet" href="player.css">
</head>
<body>
<div id="app">
  <div id="stage">
    <img id="slide" alt="">
    <div id="mathwrites"></div>
    <div id="overlays"></div>
    <div id="captions"><span id="caption-text"></span></div>
  </div>
  <audio id="narration" preload="metadata">
    <source src="narration.wav" type="audio/wav">
  </audio>
  <div id="controls">
    <button id="play" type="button" aria-label="Play / Pause">▶</button>
    <button id="cc" type="button" class="toggle on" aria-label="Toggle captions" aria-pressed="true">CC</button>
    <span id="page-info">— / —</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1">
    <span id="time">0:00 / 0:00</span>
    <select id="speed">
      <option value="0.75">0.75×</option>
      <option value="1" selected>1×</option>
      <option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option>
    </select>
  </div>
</div>
<script>
/* __TIMELINE__ */
</script>
<script src="hershey-font.js"></script>
<script src="player.js"></script>
</body>
</html>
